name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read
  pull-requests: write

jobs:
  lint:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - run: brew install swiftlint # not preinstalled on macos-26, despite the image readme
      - run: swiftlint lint --strict --reporter junit --output swiftlint.xml
      - if: ${{ !cancelled() }}
        run: swift format lint --strict --recursive Sources Package.swift
      - if: ${{ !cancelled() && !env.ACT }}
        uses: actions/upload-artifact@v7
        with:
          path: swiftlint.xml
          archive: false
      - if: ${{ !cancelled() && github.event_name == 'pull_request' && !env.ACT }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          report=$(swiftlint lint --quiet --reporter markdown | sed "s|$PWD/||")
          [ "$(echo "$report" | wc -l)" -gt 2 ] || report="✅ No SwiftLint violations"
          printf '### SwiftLint\n\n%s\n' "$report" > lint.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file lint.md --edit-last --create-if-none
