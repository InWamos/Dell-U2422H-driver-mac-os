name: Release

on:
  push:
    branches: [main]
    paths:
      - Package.swift
      - Sources/**
      - packaging/**
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    env:
      VERSION: 0.1.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build app bundle
        run: packaging/bundle-app.sh "$VERSION"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "v$VERSION" "dist/U2422HControl-$VERSION.zip"
          --target "$GITHUB_SHA"
          --title "U2422H Control $VERSION"
          --notes-file packaging/release-notes.md
          --generate-notes
